name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # lock は npm 11 で作っている。Node 22 付属の npm 10 だと npm ci が lock を受け付けない
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx vitest run --project unit
      # microCMS の鍵を CI に置かないため、モックデータでビルドする
      - run: npx next build
        env:
          USE_MOCK: 'true'
          MICROCMS_SERVICE_DOMAIN: dummy
          MICROCMS_API_KEY: dummy
