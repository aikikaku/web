name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci は、macOS で作った lock に Linux 用の追加パッケージが載っていないと失敗するため、Vercel と同じく npm install を使う
      - run: npm install --no-audit --no-fund
      - run: npx vitest run --project unit
      # microCMS の鍵を CI に置かないため、モックデータでビルドする
      - run: npx next build
        env:
          USE_MOCK: 'true'
          MICROCMS_SERVICE_DOMAIN: dummy
          MICROCMS_API_KEY: dummy
